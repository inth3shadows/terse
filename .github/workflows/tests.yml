name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read          # least privilege — the workflow only reads the repo
jobs:
  lint:
    # Deterministic and version-independent — its own job so a lint failure reports as
    # one named check, not 3 identical red X's under the pytest matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0        # hatch-vcs derives the version from git history + tags
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - run: uv sync --dev          # no anthropic extra: keeps CI keyless, matches design
      - run: uv run ruff check .
      - run: uv run mypy            # checked annotations (audit fix #1); config in pyproject
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor (the requires-python promise) through current stable. Test both ends so
        # a ">=3.11" claim is actually verified, not just the dev default. 3.14 is left
        # off until tiktoken ships wheels for it (else CI compiles the Rust ext + fails).
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0        # hatch-vcs derives the version from git history + tags
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - run: uv sync --dev          # no anthropic extra: keeps CI keyless, matches design
      # Coverage is REPORTED, never gated: no --cov-fail-under. The suite had no coverage
      # number at all before this, and a threshold picked before anyone had looked at the
      # baseline would be an arbitrary gate that fails on unrelated PRs. Printing it every
      # run is what makes the number visible enough to set an honest floor later.
      - run: uv run pytest -q --cov --cov-report=term-missing
  docker:
    # The image is a DOCUMENTED user path (`docker run -i --rm terse uvx some-mcp-server`,
    # see the Dockerfile header and USAGE.md) that nothing verified: it was added in #194
    # on 2026-07-30 and sat unbuilt for three weeks. It is NOT covered by the Glama
    # registry either — Glama builds a spec it generates itself and ignores this file — so
    # this job is the only thing standing between the Dockerfile and silent rot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0        # hatch-vcs derives the version from git history + tags
      - run: docker build -t terse:ci .
      # Build-only would pass on an image that starts and compresses NOTHING. So drive a
      # real MCP stdio session and assert on the codec output. The trailing `sleep` holds
      # stdin open long enough for the last response: the container exits on EOF, and
      # without it the proxy is killed mid-reply.
      - name: smoke test the image over MCP stdio
        run: |
          set -euo pipefail
          {
            echo '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1.0"}}}'
            echo '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"demo_orders","arguments":{"limit":40}}}'
            sleep 5
          } | docker run -i --rm terse:ci > smoke.out
          cat smoke.out
          # Three responses, in order: initialize, tools/list, the compressed tools/call.
          # Match on "id" loosely — terse re-serializes compactly (`"id":2`) while the
          # downstream demo server emits `"id": 2`, so a spaced pattern silently misses.
          test "$(wc -l < smoke.out)" -eq 3 \
            || { echo "::error::expected 3 JSON-RPC responses, got $(wc -l < smoke.out)"; exit 1; }
          grep -q '"serverInfo"' smoke.out \
            || { echo "::error::no initialize result — the proxy never came up"; exit 1; }
          grep -q '"demo_orders"' smoke.out \
            || { echo "::error::tools/list did not reach through the proxy"; exit 1; }
          # The actual product claim: the 40-record order book came back table-encoded.
          grep -q '__terse_table__' smoke.out \
            || { echo "::error::result was NOT compressed — the codec did not fire"; exit 1; }

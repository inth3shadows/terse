# Security checks: gitleaks (secrets in the commits this event added),
# osv-scanner (known-vulnerable dependencies) and zizmor (workflow security).
# The scanners are sha256-verified release binaries, not marketplace actions.
# Per-repo tuning goes in each tool's own config: .gitleaks.toml,
# osv-scanner.toml (next to the lockfile), .github/zizmor.yml.

name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Cancel superseded PR runs only: a cancelled push run leaves its commits unscanned.
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: gitleaks / osv-scanner / zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install scanners (sha256-verified)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/secbin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          fetch() { curl -fsSL --retry 3 -o "$3" "$1"; echo "$2  $3" | sha256sum -c --quiet -; }
          fetch https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb gitleaks.tgz
          fetch https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 \
            160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b osv-scanner
          fetch https://github.com/zizmorcore/zizmor/releases/download/v1.32.0/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b zizmor.tgz
          tar -xzf gitleaks.tgz -C "$bin" gitleaks
          tar -xzf zizmor.tgz -C "$bin" zizmor
          install -m 0755 osv-scanner "$bin/osv-scanner"
          rm -f gitleaks.tgz zizmor.tgz osv-scanner
          echo "$bin" >> "$GITHUB_PATH"

      - name: gitleaks (commits added by this event)
        if: ${{ !cancelled() }}
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        # gitleaks reports "0 commits scanned, no leaks" (exit 0) on an unknown
        # revision, so every range endpoint is checked to exist first.
        run: |
          set -euo pipefail
          have() { git cat-file -e "$1^{commit}" 2>/dev/null; }
          range=""
          if [ "$EVENT" = pull_request ] && have "$PR_HEAD"; then
            if have "$PR_BASE"; then
              range="$PR_BASE..$PR_HEAD"
            elif mb=$(git merge-base "$PR_HEAD" "origin/$PR_BASE_REF" 2>/dev/null); then
              range="$mb..$PR_HEAD"   # base branch was force-pushed after the PR opened
            fi
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          fi
          if [ -n "$range" ]; then
            echo "scanning commits $range"
            gitleaks git --no-banner --redact --exit-code 1 --log-opts="$range" .
          else
            echo "no usable commit range (new branch or force-push); scanning the working tree"
            gitleaks dir --no-banner --redact --exit-code 1 .
          fi

      - name: osv-scanner (dependencies)
        if: ${{ !cancelled() }}
        run: |
          set +e
          osv-scanner scan source -r .
          rc=$?
          # 127 = general error, typically transitive resolution of a manifest
          # failing (e.g. a `torch==X+cpu` local-version pin that deps.dev cannot
          # resolve). Retry with only the declared/locked packages, and say so.
          if [ "$rc" -eq 127 ]; then
            echo "::warning title=osv-scanner::transitive resolution failed; rescanning with --no-resolve (manifest-only deps are not expanded)"
            osv-scanner scan source -r --no-resolve .
            rc=$?
          fi
          # 128 = no lockfiles/manifests found: nothing to scan is not a failure.
          if [ "$rc" -eq 128 ]; then echo "osv-scanner: no packages found"; exit 0; fi
          exit "$rc"

      - name: zizmor (workflow security)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .github/workflows
